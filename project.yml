# Generate the Xcode project with:  xcodegen generate
name: Proximity
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your Apple developer team here (or pick it in Xcode → Signing & Capabilities).
    DEVELOPMENT_TEAM: ""
targets:
  Proximity:
    type: application
    platform: iOS
    sources:
      - path: Proximity
    info:
      path: Proximity/Info.plist
      properties:
        CFBundleDisplayName: Proximity
        UILaunchScreen: {}
        UIAppFonts:
          - PressStart2P-Regular.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        UIRequiredDeviceCapabilities:
          - bluetooth-le
        NSBluetoothAlwaysUsageDescription: Proximity uses Bluetooth to find people standing right next to you, so you can only add friends you've actually met.
        NSCameraUsageDescription: The camera scans a friend's QR code when you add them in person.
    entitlements:
      path: Proximity/Proximity.entitlements
      properties:
        # CloudKit needs a paid developer account. With a free account, delete these
        # two keys and remove CLOUDKIT from SWIFT_ACTIVE_COMPILATION_CONDITIONS below.
        com.apple.developer.icloud-container-identifiers:
          - iCloud.$(PRODUCT_BUNDLE_IDENTIFIER)
        com.apple.developer.icloud-services:
          - CloudKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.proximity
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) CLOUDKIT
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  ProximityTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ProximityTests
    dependencies:
      - target: Proximity
schemes:
  Proximity:
    build:
      targets:
        Proximity: all
    test:
      targets:
        - ProximityTests
